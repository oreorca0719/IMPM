[project]
name = "impm-mcp"
version = "0.1.0"
description = "IMPM MCP server — Claude Code 가 STRIPE 프로젝트를 관리하도록 IMPM API를 도구로 노출"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
impm-mcp = "impm_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["impm_mcp"]
