# (선택) 호스트 레벨 리버스 프록시 샘플 — 도메인 + HTTPS(certbot) 종단용.
# 기본 구성은 frontend 컨테이너의 nginx가 정적 서빙 + /api 프록시를 담당하므로
# 단일 서버라면 이 파일 없이도 동작한다. 커스텀 도메인/HTTPS 연결 시(P8) 참고.
server {
    listen 80;
    server_name your-domain.example.com;

    # certbot 발급 후 아래 443 서버 블록으로 전환
    location / {
        proxy_pass http://127.0.0.1:80;   # frontend 컨테이너
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
